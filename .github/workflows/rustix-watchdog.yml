name: Rustix Heartbeat Watchdog

on:
  schedule:
    # 每 30 分鐘檢查一次（心跳為準，唔係直連探測）
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: rustix-watchdog
  cancel-in-progress: false

jobs:
  Rustix-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 安装依赖（淨 requests，秒裝）
        run: pip install -q requests

      # 心跳為準：讀 weather.2088x.com/__status 嘅 rustix hb age
      # （直連 hk-01.rustix.me:24151 已於 2026-09-18 移除：該 hostname DNS NXDOMAIN，只有假警報）
      - name: 💓 Rustix 心跳检查 + TG 預警
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATUS_URL: https://weather.2088x.com/__status
          STALE_LIMIT: "1200"
          PANEL_URL: https://rustix.me
        run: python3 -u rustix_watchdog.py
