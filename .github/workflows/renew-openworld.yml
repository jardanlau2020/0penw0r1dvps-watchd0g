name: Openworld VPS Watchdog (手動備用)

on:
  # 2026-09-10：站方換咗互動真人驗證碼，自動續期停止；
  # 到期監控已遷到 NAS 持久區容器 cron（密鑰唔再入 repo）。
  # GHA 只留手動備用：要Secrets入面配好 OPENWORLD_COOKIES / TG_* 先至有用。
  workflow_dispatch:

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install playwright requests ddddocr Pillow numpy
          playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        env:
          OPENWORLD_COOKIES: ${{ secrets.OPENWORLD_COOKIES }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
          ORT_LOGGING_LEVEL: "3"
        run: |
          xvfb-run --auto-servernum python3 apprenew.py

      - name: 💾 上传验证码 GIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: captcha-gifs
          path: |
            *.gif
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f Xvfb || true

      - name: 🖼️ 上传调试截图
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots
          path: |
            *.png
            *.jpg
          if-no-files-found: ignore
          retention-days: 7
