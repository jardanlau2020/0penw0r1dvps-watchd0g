name: Openworld VPS Renew

on:
  schedule:
    # 01:00 UTC = 北京 09:00，沿用老板这份原来的节奏（上游是 00:55，差 5 分钟无收益）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练：照跑一遍，但不发 Telegram（消息原文打日志）'
        type: boolean
        default: false
      dump_dom:
        description: '只抓 VPS 页真实 DOM（HTML/script src/可疑元素），不点续期、不碰验证码'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🛠️ 安装依赖（patchright + opencv）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # patchright 是带反检测补丁的 playwright，浏览器二进制要单独装
      - name: 🌐 安装 Chromium（patchright）
        run: |
          patchright install --with-deps chromium || playwright install --with-deps chromium

      # ── 跨轮次熔断计数 ──────────────────────────────────────────────
      # 连续 2 轮 cron 失败就停手并通知（B7）。单轮内部仍给足上游 12 次重试。
      - name: ♻️ 恢复熔断计数
        uses: actions/cache/restore@v4
        with:
          path: ow_fail_streak.txt
          key: owfail-${{ github.run_id }}
          restore-keys: |
            owfail-

      - name: 🔄 运行续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OPENWORLD_COOKIES: ${{ secrets.OPENWORLD_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_NAME: ${{ secrets.ACCOUNT_LABEL }}
          HEADLESS: "true"
          SCREENSHOT_DIR: "./screenshots"
          CLERK_EXCHANGE_WAIT: "90"
          MAX_FAIL_STREAK: "2"
          DUMP_DOM: ${{ inputs.dump_dom && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # 阈值走 repo variable，临时调高可强制进续期窗口做验证（默认 5）
          RENEW_THRESHOLD_DAYS: ${{ vars.RENEW_THRESHOLD_DAYS || '5' }}
        run: python apprenew.py

      - name: 💾 保存熔断计数
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ow_fail_streak.txt
          key: owfail-${{ github.run_id }}

      - name: 🧪 上传 DOM 侦察结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dom-dump
          path: |
            screenshots/dom_*.html
            screenshots/dom_*.txt
            screenshots/dom_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🖼️ 上传截图（失败也保留，方便排查）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f chrome || true
