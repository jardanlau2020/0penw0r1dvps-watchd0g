name: Openworld VPS Renew

on:
  schedule:
    # 01:00 UTC = 北京時間 09:00（每日續期與到期預警）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: 🚀 执行 Openworld 续期
        env:
          OPENWORLD_USERNAME: ${{ secrets.OPENWORLD_USERNAME }}
          OPENWORLD_PASSWORD: ${{ secrets.OPENWORLD_PASSWORD }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python renew_openworld.py

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openworld-debug-screenshots
          path: /tmp/*.png
          retention-days: 7
