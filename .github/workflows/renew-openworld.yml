name: Openworld VPS Renew

on:
  schedule:
    # 01:00 UTC = 北京 09:00，沿用老板这份原来的节奏（上游是 00:55，差 5 分钟无收益）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练：照跑一遍，但不发 Telegram（消息原文打日志）'
        type: boolean
        default: false
      dump_dom:
        description: '只抓 VPS 页真实 DOM（HTML/script src/可疑元素），不点续期、不碰验证码'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  MIHOMO_VERSION: "1.19.34"

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🛠️ 安装依赖（patchright + opencv）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # patchright 是带反检测补丁的 playwright，浏览器二进制要单独装
      - name: 🌐 安装 Chromium（patchright）
        run: |
          patchright install --with-deps chromium || playwright install --with-deps chromium

      # ── 跨轮次熔断计数 ──────────────────────────────────────────────
      # 连续 2 轮 cron 失败就停手并通知（B7）。单轮内部仍给足上游 12 次重试。
      # ── 家宽出口（mihomo）────────────────────────────────────────────
      # Discord 用户 token 从 GHA 机房 IP（Azure 20.99.x.x）发起会话，会被判异常
      # 并吊销；所以 Discord OAuth 与后续所有请求都走住宅出口。
      # 没配 HOME_SUB_URL / HOME_SUB_GZ 时跳过本步，行为与之前一致（直连）。
      - name: 🏠 启动家宽出口（mihomo）
        id: homeproxy
        env:
          HOME_SUB_URL: ${{ secrets.HOME_SUB_URL }}
          HOME_SUB_GZ: ${{ secrets.HOME_SUB_GZ }}
        run: |
          set -euo pipefail
          HAVE_URL=0; [ -n "${HOME_SUB_URL:-}" ] && HAVE_URL=1
          HAVE_GZ=0;  [ -n "${HOME_SUB_GZ:-}" ]  && HAVE_GZ=1
          # 2026-11-23 防复发：出口拉不起来就硬失败，不再回落到直连。
          # 实证 run 45137814233：直连机房 IP（40.76.x / 14.133.x）下验证码
          # 12 次会话全被 WS 踢，白烧熔断额度（MAX_FAIL_STREAK=2）。
          # 同一天恢复住宅出口后第 6 次就过 → 缺的是干净 IP，不是重试次数。
          # 真要走直连调试（演练/dump DOM），显式设 ALLOW_DIRECT=1 才放行。
          if [ "$HAVE_URL" = 0 ] && [ "$HAVE_GZ" = 0 ]; then
            if [ "${ALLOW_DIRECT:-0}" = "1" ]; then
              echo "⚠️ 未配置 HOME_SUB_URL / HOME_SUB_GZ，但 ALLOW_DIRECT=1 → 走直连（仅调试用）"
              exit 0
            fi
            echo "❌ 未配置 HOME_SUB_URL / HOME_SUB_GZ：拒绝走直连"
            echo "   原因：机房 IP 下验证码必然被踢，只会白烧熔断额度"
            echo "   修：把住宅订阅写进 secret HOME_SUB_URL，或改用 HOME_SUB_GZ"
            echo "   调试时确实要走直连，显式设 ALLOW_DIRECT=1"
            exit 1
          fi

          echo "⬇️ 下载 mihomo ${MIHOMO_VERSION}"
          curl -fsSL --retry 3 -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          # 校验值取自 GitHub release asset 的官方 digest（v1.19.34, 22731319 bytes）
          echo "223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc  /tmp/mihomo.gz" | sha256sum -c -
          gunzip -f /tmp/mihomo.gz
          mv /tmp/mihomo ./mihomo-bin
          chmod +x ./mihomo-bin

          mkdir -p ./mihomo-home
          if [ "$HAVE_GZ" = 1 ]; then
            echo "📦 用 HOME_SUB_GZ 还原配置（首选）"
            echo "$HOME_SUB_GZ" | base64 -d | gunzip > ./mihomo-home/config.yaml
          elif [ "$HAVE_URL" = 1 ] && curl -fsSL --retry 2 --max-time 30 -o ./mihomo-home/config.yaml "$HOME_SUB_URL"; then
            echo "✅ 订阅地址可用"
          else
            echo "❌ 无可用配置来源"
            exit 1
          fi
          # 注：v1.19.25 的 TLSCrypt 字段没有 omitempty、是必填，而这条订阅 76 个
          # openvpn 节点全都没有 tls-crypt → 启动即 fatal:
          #   "proxy 63: '' has unset fields: tls-crypt"
          # v1.19.30 起改成 `tls-crypt,omitempty`，所以升版本即可，配置不用动。
          echo "--- proxies 统计（不依赖 pyyaml）---"
          echo "openvpn 节点: $(grep -c 'type: openvpn' ./mihomo-home/config.yaml || echo 0)"
          echo "proxies 条目: $(grep -cE '^[[:space:]]*- name:' ./mihomo-home/config.yaml || echo 0)"

          nohup ./mihomo-bin -d ./mihomo-home -f ./mihomo-home/config.yaml > mihomo.log 2>&1 &
          sleep 8
          if ! ss -tuln | grep -q ':7890'; then
            echo "❌ mihomo 没起来，日志如下"; cat mihomo.log || true; exit 1
          fi

          DIRECT_IP="$(curl -s --max-time 8 https://api.ipify.org || echo '')"
          PROXY_IP="$(curl -s --max-time 20 -x http://127.0.0.1:7890 https://api.ipify.org || echo '')"
          echo "📡 直连出口 IP: ${DIRECT_IP:-未知}"
          echo "📡 家宽出口 IP: ${PROXY_IP:-未知}"
          if [ -z "$PROXY_IP" ]; then echo "❌ 家宽出口不通，直接失败退出（不白跑）"; exit 1; fi
          if [ "$PROXY_IP" = "$DIRECT_IP" ]; then echo "❌ 出口 IP 与直连相同，代理没生效，直接失败退出"; exit 1; fi

          # 出口纯净度：PROXY_IP != DIRECT_IP 不够 —— 落到 Cloudflare WARP（104.28.x）
          # 也会通过，但那不是住宅。这条订阅的 vless 那一跳出口全是 WARP
          # （hosting=true proxy=true），真住宅在 openvpn 那一跳。
          info=$(curl -s --max-time 20 -x http://127.0.0.1:7890 \
            'http://ip-api.com/json/?fields=status,query,country,isp,org,as,hosting,proxy' || echo '{}')
          echo "出口详情: $info"
          hosting=$(echo "$info" | jq -r '.hosting | tostring')
          if [ "$hosting" != "false" ]; then
            echo "❌ 出口不是住宅（hosting=$hosting），尝试切到 🏠 家宽自动"
            # mihomo external-controller 默认在 9090；没开时下面会静默失败，走最终 exit 1
            SEL=$(python3 -c "import urllib.parse;print(urllib.parse.quote('🚀 节点选择'))")
            curl -s -X PUT "http://127.0.0.1:9090/proxies/$SEL" \
              -H "Content-Type: application/json" \
              --data-binary '{"name":"🏠 家宽自动"}' || true
            sleep 3
            info=$(curl -s --max-time 20 -x http://127.0.0.1:7890 \
              'http://ip-api.com/json/?fields=status,query,country,isp,org,as,hosting,proxy' || echo '{}')
            echo "切组后出口详情: $info"
            hosting=$(echo "$info" | jq -r '.hosting | tostring')
            if [ "$hosting" != "false" ]; then
              echo "❌ 切组后仍不是住宅（hosting=$hosting）"
              exit 1
            fi
          fi

          echo "✅ 家宽出口就绪：$PROXY_IP"
          # 只让业务请求走代理；GitHub / Telegram 走直连。
          # 冷王审 #6 时指出：GITHUB_ENV 的 HTTP(S)_PROXY 是全局生效的，
          # 会把 upload-artifact（node action）和 Telegram 推送也拽进代理，
          # 哪天传不上去就是白跑一整轮还看不出原因。这里用 NO_PROXY 白名单排掉。
          # 注意：NO_PROXY 只影响 requests/curl 这类认它的客户端；Chromium 的
          # 代理是 launch(proxy=...) 显式给的，不受影响 —— Discord 仍然走住宅出口。
          # 后缀匹配（proxy-from-env 语义）：github.com 盖不到 githubusercontent.com，
          # 而 upload-artifact 的上传端点是 results-receiver.actions.githubusercontent.com，
          # 请求头里带 ACTIONS_RUNTIME_TOKEN（Bearer）——绝不能让这个 Bearer 走第三方住宅出口。
          # 用 githubusercontent.com 一把盖住 objects. / raw. / results-receiver.actions. / pipelines.actions.。
          NO_PROXY_LIST="localhost,127.0.0.1,::1,github.com,githubusercontent.com,api.telegram.org"
          echo "CHROME_PROXY=http://127.0.0.1:7890" >> "$GITHUB_ENV"
          echo "HTTP_PROXY=http://127.0.0.1:7890"   >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://127.0.0.1:7890"  >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://127.0.0.1:7890"    >> "$GITHUB_ENV"
          echo "NO_PROXY=$NO_PROXY_LIST"            >> "$GITHUB_ENV"
          echo "no_proxy=$NO_PROXY_LIST"            >> "$GITHUB_ENV"
          echo "NODE_PROXY_IP=$PROXY_IP"            >> "$GITHUB_ENV"
      - name: ♻️ 恢复熔断计数
        uses: actions/cache/restore@v4
        with:
          path: ow_fail_streak.txt
          key: owfail-${{ github.run_id }}
          restore-keys: |
            owfail-

      - name: 🔄 运行续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OPENWORLD_COOKIES: ${{ secrets.OPENWORLD_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_NAME: ${{ secrets.ACCOUNT_LABEL }}
          HEADLESS: "true"
          SCREENSHOT_DIR: "./screenshots"
          CLERK_EXCHANGE_WAIT: "90"
          MAX_FAIL_STREAK: "2"
          DUMP_DOM: ${{ inputs.dump_dom && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # 阈值走 repo variable，临时调高可强制进续期窗口做验证（默认 5）
          RENEW_THRESHOLD_DAYS: ${{ vars.RENEW_THRESHOLD_DAYS || '5' }}
        run: python apprenew.py

      - name: 💾 保存熔断计数
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ow_fail_streak.txt
          key: owfail-${{ github.run_id }}

      - name: 🧪 上传 DOM 侦察结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dom-dump
          path: |
            screenshots/dom_*.html
            screenshots/dom_*.txt
            screenshots/dom_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🖼️ 上传截图（失败也保留，方便排查）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f chrome || true
