name: Openworld VPS Watchdog

on:
  schedule:
    # GitHub cron 用 UTC：01:00 UTC = 北京 09:00（每日到期預警）
    - cron: '0 1 * * *'
    # Rustix 心跳 watchdog：每 30 分鐘一輪（*/30 分）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_restart:
        description: '只測 Rustix 自動重啟鏈路（唔跑 Openworld 續期）'
        type: boolean
        default: false

jobs:
  Renew-openworld:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.test_restart != true)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install playwright requests Pillow numpy
          playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        env:
          OPENWORLD_COOKIES: ${{ secrets.OPENWORLD_COOKIES }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
          ORT_LOGGING_LEVEL: "3"
        run: |
          xvfb-run --auto-servernum python3 apprenew.py

      - name: 💾 上传验证码 GIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: captcha-gifs
          path: |
            *.gif
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f Xvfb || true

      - name: 🖼️ 上传调试截图
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots
          path: |
            *.png
            *.jpg
          if-no-files-found: ignore
          retention-days: 7

  # ==================================================================
  # Rustix 天氣心跳節點 watchdog
  # 心跳目標：weather.2088x.com/__status 的 rustix 節點
  # offline > 20 分鐘 → 試自動重啟（panel API）→ 複查心跳 → TG 報結果
  # ==================================================================
  Rustix-watchdog:
    if: github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 設置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖（bot-hosting 同配方）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install -q seleniumbase requests
          seleniumbase install chromedriver

      - name: 🔍 Rustix 心跳检查 + 自動重啟
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUSTIX_PTERO_KEY: ${{ secrets.RUSTIX_PTERO_KEY }}
          STATUS_URL: https://weather.2088x.com/__status
          STALE_LIMIT: "1200"   # 20 分鐘無心跳 = offline
          PANEL_URL: https://rustix.me
          RUSTIX_UUID_PREFIX: e9fb06d1
          TEST_RESTART: ${{ github.event.inputs.test_restart || 'false' }}
        run: |
          set -eu
          # 快速心跳預檢（零依賴，生猛就即刻收工）
          hb=$(curl -s --max-time 30 "$STATUS_URL" | python3 -c "
          import json,sys,time
          try:
              d=json.load(sys.stdin)
              p=[x for x in d.get('platforms',[]) if x.get('key')=='rustix']
              print(int((time.time()*1000-p[0]['hb'])/1000) if p and p[0].get('hb') else 999999)
          except Exception:
              print(999999)")
          echo "heartbeat age: ${hb}s (limit ${STALE_LIMIT}s)"
          if [ "$hb" -le "$STALE_LIMIT" ] && [ "$TEST_RESTART" != "true" ]; then
            echo "✅ RUSTIX_OK heartbeat=${hb}s"
            exit 0
          fi
          # offline / 測試模式 → 行重啟鏈
          which google-chrome chromium chrome chromedriver || true
          xvfb-run --auto-servernum python3 -u rustix_watchdog.py
